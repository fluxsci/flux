[package]
name = "figforge"
version = "0.1.0"
description = "A minimal, fast, local app for arranging scientific figures"
authors = ["Kort Driessen"]
edition = "2021"
rust-version = "1.77"

# The library that holds the app; `main.rs` is a thin launcher around it.
[lib]
name = "figforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Export pipeline. We use each crate's *re-exported* usvg (resvg::usvg /
# svg2pdf::usvg) so their usvg versions never have to match ours.
resvg = "0.47"
svg2pdf = "0.13"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
