name: release

on:
  push:
    tags: ["v*"] # tag MUST match package.json "version" — electron-builder names the release v${version}
  workflow_dispatch: # manual "Run workflow" button in the Actions tab (for testing/verification)

permissions:
  contents: write # electron-builder creates/updates the GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon runner; cross-builds the x64 slice too
            args: "--mac"
          - os: ubuntu-latest
            args: "--linux"
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Boolean only (not the secret) so steps can branch in `if:`. The actual
      # signing secrets are injected ONLY into the signed step below — keeping
      # them out of the unsigned path, where empty values would otherwise push
      # electron-builder into a (failing) code-signing attempt.
      HAS_SIGNING: ${{ secrets.MAC_CSC_LINK != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # The Apple Silicon runner naturally installs only the arm64 optional
      # node-pty payload, but this job emits both arm64 and x64 apps. Stage both
      # pinned prebuilds explicitly so each cross-built app can open Flux's
      # integrated terminal without compiling a native dependency in CI.
      - name: Stage both macOS terminal architectures
        if: matrix.os == 'macos-latest'
        run: npm install --no-save --package-lock=false --force @lydell/node-pty-darwin-arm64@1.1.0 @lydell/node-pty-darwin-x64@1.1.0

      # A tag must not ship a broken build — run the same headless gate CI uses.
      - name: Correctness gate (svelte-check + pure verify tier)
        run: npm run check && npm run test:pure

      - run: npm run build # Vite -> ./dist (MUST precede electron-builder)

      - name: Fetch pinned correction runtime (macOS)
        if: matrix.os == 'macos-latest'
        run: node scripts/fetch-correction-runtime.mjs --platform darwin --arches arm64,x64

      - name: Fetch pinned correction runtime (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/fetch-correction-runtime.mjs --platform linux --arches x64

      - name: Package · sign · notarize · publish (macOS, signed)
        if: matrix.os == 'macos-latest' && env.HAS_SIGNING == 'true'
        run: npx electron-builder --mac -c.mac.notarize.teamId="$APPLE_TEAM_ID" --publish always
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package · publish (macOS unsigned / Linux)
        if: matrix.os != 'macos-latest' || env.HAS_SIGNING != 'true'
        # On the unsigned macOS path, disable electron-builder's own signing
        # (-c.mac.identity=null) and hardened runtime; the ad-hoc signature is
        # applied solely by build/afterPack.cjs so the app still launches on
        # Apple Silicon. These -c.mac.* overrides are harmless on the Linux build.
        run: npx electron-builder ${{ matrix.args }} -c.mac.identity=null -c.mac.hardenedRuntime=false --publish always
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # never hunt for a cert on the unsigned path
