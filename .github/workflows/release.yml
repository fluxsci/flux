name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # qualification artifacts only; manual runs never publish

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      FLUX_ELECTRON_NO_SANDBOX: ${{ matrix.platform == 'linux' && '1' || '0' }}
      FLUX_GALLERY_ALLOW_DESKTOP: '1' # disposable hosted desktop, never an owner's session
      FLUX_STASH_ALLOW_DESKTOP: '1' # same disposable hosted desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.7.32'
          tinytex: ${{ matrix.platform == 'darwin' }}
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Native display and packaging libraries (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libvulkan1 libfuse2 libarchive-tools texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Provision PDF dependencies before offline checks (macOS)
        if: matrix.platform == 'darwin'
        run: tlmgr install lmodern koma-script bookmark tools booktabs caption float framed fvextra microtype upquote footnotehyper tcolorbox
      # Both local and CI qualification use the same clean-source/tag/checks,
      # freshly staged helpers, fresh artifact directory and packaged smokes.
      # No builder invocation can publish before these steps have passed.
      - name: Qualify Linux
        if: matrix.platform == 'linux'
        env:
          FLUX_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: xvfb-run -a node scripts/release-check.mjs --platform linux --arch x64
      - name: Qualify native macOS architecture
        if: matrix.platform == 'darwin'
        env:
          FLUX_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/release-check.mjs --platform darwin --arch ${{ matrix.arch }}
      - name: Preserve all attempts and artifact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/qualification-*/qualification.json
            release/qualification-*/checks/**
            release/qualification-*/artifacts/*.deb
            release/qualification-*/artifacts/*.AppImage
            release/qualification-*/artifacts/*.dmg
            release/qualification-*/artifacts/*.zip
            release/qualification-*/artifacts/smoke-evidence/**
            test-results/runs/**
          if-no-files-found: error

  publish:
    needs: qualify
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: qualification-*
          path: qualified-artifacts
      - name: Require all architectures, exact provenance and platform approval
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release-evidence.mjs --directory qualified-artifacts --platform-evidence docs/release-platform-evidence.json --artifact-list verified-artifacts.nul
      - name: Publish the verified artifacts as a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' artifacts < verified-artifacts.nul
          gh release create "$RELEASE_TAG" "${artifacts[@]}" --draft --verify-tag --title "Flux $RELEASE_TAG" --generate-notes
