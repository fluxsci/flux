name: ci

# Correctness gate on every push/PR to main. The blocking `test` job is fully
# headless: type-check → build → hermetic pure verify tier
# (build (which proves BOTH the Vite bundle and the CLI+MCP node bundles)) →
# CLI/MCP stdio handshakes against the built bundles. A broken commit can't reach
# a release tag (release.yml runs the same gate first). `test-windows` repeats
# the headless path on a Windows runner (observing until promoted, see below).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.7.32'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Provision PDF dependencies before offline artifact checks
        run: |
          sudo apt-get update
          # librsvg2-bin: Quarto needs rsvg-convert to place an SVG figure in a
          # PDF, and verify-slide-embed-export compiles a document that does.
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern librsvg2-bin
      - name: Provision and rehash the pinned host video encoder
        run: node scripts/fetch-video-encoder.mjs
      - name: Type-check (svelte-check must be 0 errors)
        run: npm run check && npm run check:headless
      - name: Build (Vite bundle + dist/flux-cli.mjs + dist/flux-mcp.mjs)
        run: npm run build
      - name: Pure verify tier (hermetic — no network, no dev server)
        env:
          FLUX_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/run-verifies.mjs --tier pure --jobs 4
      - name: Upload verify summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pure-verify-summary
          path: test-results/runs/**
      - name: Assert the packaged bundles were emitted
        run: |
          for f in dist/flux-cli.mjs dist/flux-cli-core.mjs dist/flux-mcp.mjs dist/flux-fulltext-worker.mjs dist/slide-export-assets.json; do
            test -f "$f" || { echo "::error::missing build artifact $f"; exit 1; }
          done
      - name: Bundle handshakes (CLI + MCP over stdio against the built bundles)
        env:
          FLUX_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/run-verifies.mjs --tier bundle

  # Windows correctness gate (2026-09-25). The pure tier was green on Linux CI
  # while being UNRUNNABLE on a Windows checkout in about twenty-five separate
  # ways (npx has no executable there, sharing violations on replace, path
  # separators, absent signals/shebangs/symlinks), and seven real Windows-only
  # product bugs sat behind that — none of which a Linux runner can ever see
  # (notes/flux-windows-and-ci-2026-09-22.md). So the same type-check → build →
  # pure tier runs here too. The bundle tier is NOT run on Windows yet: its
  # slide-embed export gate needs a TeX toolchain and rsvg-convert provisioned
  # on the runner, a separate step.
  #
  # OBSERVING, on the same rule as ui-gate: continue-on-error keeps it
  # non-blocking until 5 consecutive green runs on main, then the flip is
  # deleting the single line below. Do not flip early, and do not loosen a gate
  # to get there — a Windows red is either a harness portability defect (fix
  # the gate; §9 of the engineering guide lists the recurring shapes) or a
  # Windows product bug (fix the product).
  test-windows:
    runs-on: windows-latest
    continue-on-error: true # DELETE THIS LINE after 5 consecutive green main runs
    defaults:
      run:
        shell: bash # Git Bash, so the step scripts are the Linux job's, verbatim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Two pure gates render through Quarto (export recovery, DOCX publication);
      # neither needs TeX.
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.7.32'
      # The slide gates in the pure tier drive a real Chrome (FLUX_CHROME) even
      # though they need no dev server. `stable` = the codec-bearing build, as
      # in the Linux jobs.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Provision and rehash the pinned host video encoder
        run: node scripts/fetch-video-encoder.mjs
      - name: Type-check (svelte-check must be 0 errors)
        run: npm run check && npm run check:headless
      - name: Build (Vite bundle + dist/flux-cli.mjs + dist/flux-mcp.mjs)
        run: npm run build
      # --jobs 2, not the Linux job's 4: the 2026-09-22 session saw contention
      # failures at 4 on a Windows laptop that were not regressions, and a
      # hosted Windows runner has 4 vCPUs of slower I/O. Raise it only with the
      # evidence of green runs.
      - name: Pure verify tier (hermetic — no network, no dev server)
        env:
          FLUX_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/run-verifies.mjs --tier pure --jobs 2
      - name: Upload verify summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pure-verify-summary-windows
          path: test-results/runs/**
      - name: Assert the packaged bundles were emitted
        run: |
          for f in dist/flux-cli.mjs dist/flux-cli-core.mjs dist/flux-mcp.mjs dist/flux-fulltext-worker.mjs dist/slide-export-assets.json; do
            test -f "$f" || { echo "::error::missing build artifact $f"; exit 1; }
          done

  # Browser gate (WS-7.2) — the FULL de-flaked ui tier (post sleep→condition
  # conversion: 41 scripts, retryOnce on the known-sensitive ones). Currently
  # OBSERVING: continue-on-error keeps it non-blocking until 5 consecutive
  # green runs on main, then the flip is deleting the single line below (the
  # plan's promotion condition — do not flip early, do not loosen a script to
  # get there).
  ui-gate:
    runs-on: ubuntu-latest
    continue-on-error: true # WS-7.2: DELETE THIS LINE after 5 consecutive green main runs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # The Paper export GUI gate also validates real chosen-document artifacts.
      # Jobs have separate filesystems, so the test job's Quarto is not shared.
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.7.32'
      # `chrome-version: latest` pulls a chromium-browser-snapshots build, which
      # is compiled with ffmpeg_branding=Chromium — i.e. NO H.264/AAC decoder.
      # Flux's video clips are deliberately H.264/AAC MP4 (electron/videoMedia.cjs
      # prepares them that way, and Electron ships the codecs), so the slide-clip
      # and gallery media gates hung there waiting for a decode that could never
      # happen. `stable` installs a real Chrome build with the codecs in it.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      # The server's own output is evidence: a mid-run "new dependencies
      # optimized … reloading" line is a full reload of every open page, which
      # once closed a gate's popup under it (2026-09-26). Keep it in a file and
      # ship it with the summary; a backgrounded process's later output is not
      # otherwise in the job log.
      - name: Start the dev server
        run: |
          mkdir -p test-results
          npm run dev > test-results/dev-server.log 2>&1 &
      - name: Wait for the dev server on :1420
        run: npx wait-on tcp:127.0.0.1:1420 --timeout 120000
      - name: Full ui tier
        env:
          FLUX_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/run-verifies.mjs --tier ui
      - name: The dev server never re-optimized mid-run
        if: always()
        run: |
          # Vite's wording after start-up: "dependencies optimized: <pkgs>" — or the
          # SINGULAR "dependency optimized: <pkg>" (the pdf.js worker slipped past a
          # plural-only pattern on 2026-09-26). The start-up line is "Forced
          # re-optimization of dependencies" and is fine.
          if grep -qE "dependenc(y|ies) optimized:|optimized dependencies changed" test-results/dev-server.log; then
            echo "::error::the dev server discovered dependencies after start-up and reloaded every client mid-run — add them to optimizeDeps.include in vite.config.ts"
            grep -n "optimized\|reload" test-results/dev-server.log
            exit 1
          fi
      - name: Upload ui verify summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-verify-summary
          path: |
            test-results/runs/**
            test-results/dev-server.log
