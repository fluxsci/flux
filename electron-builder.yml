appId: com.kortdriessen.flux
productName: Flux
copyright: © 2026 Kort Driessen

directories:
  buildResources: build
  output: release

# Allowlist. src/, fluxplot/, brand/, notes/, *.md are excluded by omission.
# node_modules is dropped EXCEPT the integrated-terminal native module
# (@lydell/node-pty + its per-platform prebuilt binary): electron/main.cjs
# requires it at runtime and Vite does not bundle the main process. Everything
# else the main process needs is `electron` + node builtins, and the renderer is
# fully bundled into dist/ by Vite.
files:
  - electron/**/*
  - dist/**/*
  - package.json
  - "!**/node_modules/**/*"
  - node_modules/@lydell/**/*

asar: true
# @lydell/node-pty ships prebuilt binaries (no local compile, so no rebuild),
# but its native .node must live OUTSIDE the asar archive to be loadable.
npmRebuild: false
asarUnpack:
  - node_modules/@lydell/**

# NOTE (macOS universal/dual-arch): the prebuilt binary is delivered as a
# per-platform optional dependency, so `npm install` only fetches the host's
# arch. Building both arm64 + x64 (below) from a single machine therefore needs
# BOTH @lydell/node-pty-darwin-arm64 and -darwin-x64 present first, e.g.:
#   npm i --no-save @lydell/node-pty-darwin-arm64 @lydell/node-pty-darwin-x64
# (or build each arch on its native CI runner). Linux builds one host arch and
# needs no extra step.

# Ad-hoc signs the .app on macOS when no Developer ID is configured, so unsigned
# builds still launch on Apple Silicon (arm64 refuses unsigned/broken signatures).
afterPack: build/afterPack.cjs

mac:
  category: public.app-category.productivity
  icon: build/icons/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # notarize is enabled per-build from CI (release.yml) so an unsigned build (no
  # secrets) still succeeds.

linux:
  icon: build/icons
  category: Graphics
  target:
    - AppImage
    - deb

dmg:
  title: ${productName} ${version}

publish:
  provider: github
  owner: kortdriessen
  repo: flux
  releaseType: draft
