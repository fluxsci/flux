appId: com.fluxsci.flux
productName: Flux
copyright: © 2026 Kort Driessen

# Web capture uses downloaded files and scoped intake; the old flux:// handoff
# is retired. No URL-scheme registration is needed for the installed workflow.

directories:
  buildResources: build
  output: release

# Allowlist. The one shared recipe runtime below is the only shipped src file;
# other src/, fluxplot/, brand/, notes/, *.md are excluded by omission.
# The main process uses Electron + Node builtins. The renderer is fully bundled
# into dist/ by Vite; only explicitly listed CLI dependencies ship separately.
files:
  - electron/**/*
  - src/lib/plot/recipeContract.mjs
  - dist/**/*
  - package.json
  - "!**/node_modules/**/*"

# Web capture: the browser extension ships WITH the app — the Library's setup panel opens the
# signed .xpi (Firefox) or reveals the unpacked folder (Chromium), so both must be on disk.
extraResources:
  - from: docs/_site
    to: docs
  - from: extension/dist
    to: extension/dist
  - from: extension/signed
    to: extension/signed
    filter: ["**/*.xpi"]

asar: true
npmRebuild: false
asarUnpack:
  # W13: the slide-export CLI runs in a child launched with ELECTRON_RUN_AS_NODE,
  # which has NO asar support — so the bundle + its prebaked export assets must be
  # on real disk (app.asar.unpacked/dist/), where main.cjs spawns them from.
  - dist/flux-cli.mjs
  # The launcher above imports this full bundle from beside itself.
  - dist/flux-cli-core.mjs
  - dist/flux-fulltext-worker.mjs
  - dist/slide-export-assets.json
  - electron/slideVideoWorker.cjs
  - electron/videoMedia.cjs
  - electron/entry.cjs
  # External agents launch the MCP server as a Node child too, so it needs
  # the same real-disk layout.
  - dist/flux-mcp.mjs

# Ad-hoc signs the .app on macOS when no Developer ID is configured, so unsigned
# builds still launch on Apple Silicon (arm64 refuses unsigned/broken signatures).
afterPack: build/afterPack.cjs

mac:
  category: public.app-category.productivity
  icon: build/icons/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    - from: docs/_site
      to: docs
    - from: build/video-encoder/darwin-${arch}/
      to: video-encoder/
    - from: build/correction-runtime/darwin-${arch}/
      to: corrections/runtime/
    # Web capture ships with the app (platform blocks REPLACE the top-level extraResources
    # rather than merging, so the entries are repeated here deliberately).
    - from: extension/dist
      to: extension/dist
    - from: extension/signed
      to: extension/signed
      filter: ["**/*.xpi"]
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # notarize is enabled per-build from CI (release.yml) so an unsigned build (no
  # secrets) still succeeds.

linux:
  icon: build/icons
  category: Graphics
  # Multi-window "New Window" taskbar action (2026-08-11): Exec re-runs the app
  # with --new-window; the running instance catches it via second-instance and
  # opens a window. The path matches the generated main entry's Exec for the
  # .deb (${installPrefix}/${sanitizedProductName}/${executableName}); the
  # Actions= list key is NOT auto-added by electron-builder, so it's set here.
  # (AppImage caveat: AppImageLauncher rewrites the main Exec on integration
  # but may not rewrite action Execs — the .deb is the supported target.)
  desktop:
    entry:
      Actions: "new-window;"
    desktopActions:
      new-window:
        Name: New Window
        Exec: /opt/Flux/flux --new-window %U
  extraResources:
    - from: docs/_site
      to: docs
    - from: build/video-encoder/linux-${arch}/
      to: video-encoder/
    - from: build/correction-runtime/linux-${arch}/
      to: corrections/runtime/
    # Web capture ships with the app (platform blocks REPLACE the top-level extraResources
    # rather than merging, so the entries are repeated here deliberately).
    - from: extension/dist
      to: extension/dist
    - from: extension/signed
      to: extension/signed
      filter: ["**/*.xpi"]
  target:
    - AppImage
    - deb

win:
  extraResources:
    - from: docs/_site
      to: docs
    - from: build/video-encoder/win32-${arch}/
      to: video-encoder/
    - from: extension/dist
      to: extension/dist
    - from: extension/signed
      to: extension/signed
      filter: ["**/*.xpi"]

dmg:
  title: ${productName} ${version}

publish:
  provider: github
  owner: fluxsci
  repo: flux
  releaseType: draft
